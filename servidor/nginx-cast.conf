# QubitsCast — salas e retransmissão de tela.
#
# Este vhost fica FORA da trava "só Cloudflare" de propósito, e por isso o nome está em
# /etc/blindagem/fora-da-trava.txt: o domínio é cinza (DNS-only) no Cloudflare, porque
# vídeo ao vivo passando pelo proxy do plano grátis é uso desproporcional.
#
# O WebSocket fica em um location próprio para não precisar do map $connection_upgrade
# no bloco http, que é do painel e seria sobrescrito.

server
{
    listen 80;
    listen [::]:80;
    server_name cast.qubitslab.com.br;
    include /www/server/nginx/conf/blindagem.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/cast.qubitslab.com.br/publico-acme;
        allow all;
    }

    location / { return 301 https://$host$request_uri; }
}

server
{
    # http2 na própria linha do listen: o nginx do painel é anterior à diretiva "http2 on".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cast.qubitslab.com.br;

    ssl_certificate     /etc/letsencrypt/live/cast.qubitslab.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cast.qubitslab.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSLCAST:10m;
    ssl_session_timeout 1d;

    include /www/server/nginx/conf/blindagem.conf;
    include /www/server/nginx/conf/blindagem-headers.conf;

    access_log /www/wwwlogs/cast.qubitslab.com.br.log;
    error_log /www/wwwlogs/cast.qubitslab.com.br.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/cast.qubitslab.com.br/publico-acme;
        allow all;
    }

    # Canal de sala e de mídia. Fica aberto por horas e não pode ser bufferizado:
    # buffer aqui vira atraso na imagem de quem está assistindo.
    location = /ws {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        tcp_nodelay on;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
